<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="afternoonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB75E" />
      <stop offset="100%" stop-color="#ED8F03" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Full High Sun -->
    <circle cx="50" cy="50" r="22" fill="url(#afternoonGrad)" />
    <!-- Glossy Highlight -->
    <path d="M 36 40 A 16 16 0 0 1 50 30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Outer Sun Rays -->
    <line x1="50" y1="16" x2="50" y2="22" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="50" y1="78" x2="50" y2="84" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="16" y1="50" x2="22" y2="50" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="78" y1="50" x2="84" y2="50" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="26" y1="26" x2="31" y2="31" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="69" y1="69" x2="74" y2="74" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="26" y1="74" x2="31" y2="69" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
    <line x1="69" y1="31" x2="74" y2="26" stroke="#ED8F03" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
