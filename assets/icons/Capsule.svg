<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="capLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="capRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g transform="rotate(-45 50 50)" filter="url(#shadow)">
    <!-- Top Half -->
    <path d="M 32 50 L 32 30 A 18 18 0 0 1 68 30 L 68 50 Z" fill="url(#capLeft)" />
    <!-- Bottom Half -->
    <path d="M 32 50 L 32 70 A 18 18 0 0 0 68 70 L 68 50 Z" fill="url(#capRight)" />
    <!-- Center Rim -->
    <rect x="30" y="47" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <!-- Gloss -->
    <path d="M 38 24 A 12 12 0 0 1 42 20" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
