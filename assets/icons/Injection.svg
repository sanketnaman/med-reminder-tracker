<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="syringeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998E" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g transform="rotate(-45 50 50)" filter="url(#shadow)">
    <!-- Needle -->
    <line x1="50" y1="8" x2="50" y2="24" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" />
    <!-- Barrel Tip -->
    <rect x="46" y="24" width="8" height="6" rx="1" fill="#78909C" />
    <!-- Barrel Body -->
    <rect x="40" y="30" width="20" height="42" rx="4" fill="#E0F2F1" stroke="#004D40" stroke-width="2"/>
    <!-- Liquid Inside -->
    <rect x="42" y="44" width="16" height="26" rx="2" fill="url(#syringeGrad)" />
    <!-- Plunger Base & Shaft -->
    <rect x="48" y="72" width="4" height="14" fill="#78909C" />
    <rect x="38" y="86" width="24" height="5" rx="2.5" fill="#455A64" />
    <!-- Markings -->
    <line x1="42" y1="36" x2="48" y2="36" stroke="#004D40" stroke-width="1.5" />
    <line x1="42" y1="42" x2="48" y2="42" stroke="#004D40" stroke-width="1.5" />
    <line x1="42" y1="48" x2="48" y2="48" stroke="#004D40" stroke-width="1.5" />
  </g>
</svg>
