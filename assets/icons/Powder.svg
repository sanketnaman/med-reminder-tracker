<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sachetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200" />
      <stop offset="100%" stop-color="#F7971E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Sachet Packet Body -->
    <rect x="25" y="20" width="50" height="65" rx="6" fill="url(#sachetGrad)" />
    <!-- Top & Bottom Jagged Seal Borders -->
    <path d="M 25 24 L 75 24" stroke="#E67E22" stroke-width="4" stroke-dasharray="3,3" />
    <path d="M 25 81 L 75 81" stroke="#E67E22" stroke-width="4" stroke-dasharray="3,3" />
    <!-- Powder Burst Dots Icon inside Sachet -->
    <circle cx="50" cy="48" r="4" fill="#FFFFFF" />
    <circle cx="40" cy="56" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="56" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="45" cy="65" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="55" cy="65" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
