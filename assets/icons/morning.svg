<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="morningSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F09819" />
      <stop offset="100%" stop-color="#EDDE5D" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Horizon Line -->
    <line x1="15" y1="72" x2="85" y2="72" stroke="#FF512F" stroke-width="4" stroke-linecap="round" />
    <!-- Rising Sun -->
    <path d="M 28 72 A 22 22 0 0 1 72 72 Z" fill="url(#morningSun)" />
    <!-- Sun Rays -->
    <line x1="50" y1="36" x2="50" y2="28" stroke="#F09819" stroke-width="3.5" stroke-linecap="round" />
    <line x1="32" y1="44" x2="26" y2="38" stroke="#F09819" stroke-width="3.5" stroke-linecap="round" />
    <line x1="68" y1="44" x2="74" y2="38" stroke="#F09819" stroke-width="3.5" stroke-linecap="round" />
    <!-- Upward Arrow Indicator -->
    <path d="M 50 18 L 44 24 M 50 18 L 56 24 M 50 18 L 50 26" stroke="#FF512F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
