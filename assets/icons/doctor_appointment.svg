<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background / Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4DB" />
      <stop offset="100%" stop-color="#0083B0" />
    </linearGradient>

    <!-- Medical Accent / Stethoscope Gradient -->
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998E" />
      <stop offset="100%" stop-color="#38EF7D" />
    </linearGradient>

    <!-- Clip Gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#appShadow)">
    <!-- Clipboard Base -->
    <rect x="22" y="18" width="56" height="70" rx="10" fill="url(#boardGrad)" />

    <!-- Paper Sheet -->
    <rect x="28" y="26" width="44" height="56" rx="6" fill="#FFFFFF" />

    <!-- Top Metallic Clip Base -->
    <rect x="36" y="14" width="28" height="10" rx="3" fill="url(#clipGrad)" stroke="#B0BEC5" stroke-width="1" />
    <circle cx="50" cy="19" r="2" fill="#78909C" />

    <!-- Calendar Grid Lines / Appointment Slots -->
    <!-- Month/Header Bar -->
    <rect x="34" y="32" width="32" height="6" rx="2" fill="url(#medGrad)" />
    
    <!-- Checklist Rows -->
    <circle cx="37" cy="46" r="2.5" fill="#0083B0" />
    <line x1="43" y1="46" x2="62" y2="46" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round" />

    <circle cx="37" cy="56" r="2.5" fill="#0083B0" />
    <line x1="43" y1="56" x2="62" y2="56" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round" />

    <circle cx="37" cy="66" r="2.5" fill="#0083B0" />
    <line x1="43" y1="66" x2="56" y2="66" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round" />

    <!-- Medical Stethoscope Badge Overlay -->
    <circle cx="68" cy="68" r="14" fill="#FFFFFF" />
    <circle cx="68" cy="68" r="12" fill="url(#medGrad)" />
    <!-- Stethoscope Cross Icon -->
    <path d="M 64 68 H 72 M 68 64 V 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    
    <!-- Gloss Highlight -->
    <path d="M 26 22 A 6 6 0 0 1 32 18 L 68 18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
  </g>
</svg>
