<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="syrupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E100FF" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="40" y="14" width="20" height="10" rx="3" fill="#FFD700" />
    <rect x="38" y="22" width="24" height="6" rx="2" fill="#FFA500" />
    <!-- Neck -->
    <rect x="42" y="28" width="16" height="10" fill="#E0E0E0" />
    <!-- Main Bottle Body -->
    <rect x="28" y="36" width="44" height="52" rx="10" fill="url(#syrupGrad)" />
    <!-- Liquid Level Window -->
    <rect x="34" y="50" width="32" height="32" rx="6" fill="url(#liquidGrad)" />
    <!-- Measuring Line Marks -->
    <line x1="32" y1="46" x2="40" y2="46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="56" x2="44" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="32" y1="66" x2="40" y2="66" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="32" y1="76" x2="44" y2="76" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
