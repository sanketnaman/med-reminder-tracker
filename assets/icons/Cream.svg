<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A1" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g transform="rotate(-30 50 50)" filter="url(#shadow)">
    <!-- Tube Cap -->
    <rect x="40" y="14" width="20" height="14" rx="3" fill="#333333" />
    <!-- Tube Neck -->
    <rect x="43" y="28" width="14" height="6" fill="#DCDCDC" />
    <!-- Main Body Tube -->
    <path d="M 34 34 L 66 34 L 58 84 A 4 4 0 0 1 54 88 L 46 88 A 4 4 0 0 1 42 84 Z" fill="url(#creamGrad)" />
    <!-- Folded Base Crimping -->
    <rect x="40" y="84" width="20" height="6" rx="1" fill="#E65100" opacity="0.6" />
    <!-- Decorative Swirl Line -->
    <path d="M 42 48 Q 50 54 58 48" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
